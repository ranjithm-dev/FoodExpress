spring.application.name=food-express
server.port=8080

# ==========================================================
# MySQL 8.0 Permanent Database Configuration
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=foodexpress
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate settings for MySQL 8.0
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
